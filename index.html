<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Progressive Lenses Price Card</title>
<meta name="description" content="Lenskart progressive lenses price card: two interactive versions and the original swipe card.">
<meta name="theme-color" content="#ffffff">
<meta property="og:type" content="website">
<meta property="og:title" content="Progressive Lenses Price Card">
<meta property="og:description" content="Pick a lens and see its corridor of clear vision. Two interactive versions and the original card.">
<meta property="og:image" content="https://manvendrakumar-hub.github.io/lk-progressive-lens-card/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000042'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%230fb99a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{color-scheme:light;--ink:#0d1020;--navy:#000042;--muted:#5c6376;--line:#e4e7ee;--accent:#0fb99a;--tabs-h:56px;--display:"Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box;margin:0}
html,body{height:100%;height:100dvh}
body{background:#fff;color:var(--ink);font:400 16px/1.5 var(--display);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
.tabbar{flex:none;height:var(--tabs-h);display:flex;align-items:center;gap:clamp(14px,3vw,34px);padding:0 clamp(16px,3vw,32px);background:#fff;border-bottom:1px solid var(--line);z-index:10}
.brand{display:flex;align-items:center;gap:10px;font:600 15px/1 var(--display);letter-spacing:-.005em;color:var(--navy);white-space:nowrap}
.brand::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(15,185,154,.18)}
.tabs{display:flex;align-items:stretch;height:100%;gap:clamp(16px,2.6vw,30px);overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:2px 2px 0;min-width:44px;font:600 15px/1 var(--display);color:var(--muted);cursor:pointer;white-space:nowrap;transition:color .2s,border-color .2s;touch-action:manipulation}
.tab:hover{color:var(--navy)}
.tab[aria-selected=true]{color:var(--navy);border-bottom-color:var(--navy)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px}
.tab small{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#8d95aa;margin-left:8px}
.dl{flex:none;display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 16px;border-radius:999px;background:var(--navy);color:#fff;font:600 13px/1 var(--display);text-decoration:none;transition:background .2s}
.fg{flex:none;display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);color:var(--navy);font:600 13px/1 var(--display);text-decoration:none;transition:border-color .2s,background .2s}
.fg:hover{border-color:#aab1c5;background:#f4f6f9}.fg:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.dl:hover{background:#0a0a5c}.dl:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.stage{flex:1;position:relative;min-height:0}
.panel{position:absolute;inset:0;display:none}
.panel.on{display:block}
.panel iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.fs-btn{gap:7px;touch-action:manipulation}
body.is-fs .tabbar{display:none}
.fs-exit{position:fixed;top:12px;right:14px;z-index:50;display:none;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:999px;background:rgba(0,0,66,.82);color:#fff;font:600 12.5px/1 var(--display);border:1px solid rgba(255,255,255,.18);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);cursor:pointer;touch-action:manipulation;box-shadow:0 8px 20px -10px rgba(0,0,40,.5)}
body.is-fs .fs-exit{display:inline-flex}
body.is-fs.fs-v1 .fs-exit{display:none}
@media (max-width:1240px){.tab small{display:none}.tabbar{gap:16px;padding:0 18px}.tabs{gap:18px}}
@media (max-width:1120px){.fs-btn{padding:0;width:36px}.fs-btn span{display:none}}
@media (max-width:820px){:root{--tabs-h:52px}.brand span{display:none}.tab small{display:none}.dl,.fg{padding:0 12px}.fs-btn{width:36px;padding:0}}
@media (max-width:520px){.fg:not(.fs-btn){display:none}}
</style>
</head>
<body>
<header class="tabbar">
  <div class="brand"><span>Progressive Lenses Price Card</span></div>
  <nav class="tabs" role="tablist" aria-label="Versions">
    <button class="tab" role="tab" id="tab-v5" aria-selected="true" aria-controls="panel-v5" data-tab="v5">V5<small>GIF + Lottie</small></button>
    <button class="tab" role="tab" id="tab-v4" aria-selected="false" aria-controls="panel-v4" data-tab="v4" tabindex="-1">V4<small>iPad card</small></button>
    <button class="tab" role="tab" id="tab-v1" aria-selected="false" aria-controls="panel-v1" data-tab="v1" tabindex="-1">V1<small>Cinematic</small></button>
    <button class="tab" role="tab" id="tab-v3" aria-selected="false" aria-controls="panel-v3" data-tab="v3" tabindex="-1">V3<small>Corridor diagram</small></button>
    <button class="tab" role="tab" id="tab-card" aria-selected="false" aria-controls="panel-card" data-tab="card" tabindex="-1">Original card</button>
  </nav>
  <button class="fg fs-btn" id="fsBtn" type="button" aria-label="Full screen" title="Full screen">
    <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg>
    <span>Full screen</span>
  </button>
  <a class="fg" href="https://www.figma.com/design/m8C0isLoQmUUjMDiWTLdDq" target="_blank" rel="noopener">Open in Figma</a>
  <a class="dl" href="progressive-lenses-price-card.html" download="progressive-lenses-price-card.html">Download HTML file</a>
</header>
<main class="stage">
  <section class="panel on" id="panel-v5" role="tabpanel" aria-labelledby="tab-v5"><iframe title="V5 GIF export" data-src="proto/v5/?v=5" allow="autoplay; fullscreen"></iframe></section>
  <section class="panel" id="panel-v1" role="tabpanel" aria-labelledby="tab-v1"><iframe title="V1 Cinematic" data-src="proto/v1/?v=5" allow="autoplay; fullscreen"></iframe></section>
  <section class="panel" id="panel-v3" role="tabpanel" aria-labelledby="tab-v3"><iframe title="V3 Corridor diagram" data-src="proto/v3/?v=5" allow="autoplay; fullscreen"></iframe></section>
  <section class="panel" id="panel-v4" role="tabpanel" aria-labelledby="tab-v4"><iframe title="V4 iPad card" data-src="proto/v4/?v=5" allow="autoplay; fullscreen"></iframe></section>
  <section class="panel" id="panel-card" role="tabpanel" aria-labelledby="tab-card"><iframe title="Original price card" data-src="card/?v=5" allow="autoplay; fullscreen"></iframe></section>
</main>
<button class="fs-exit" id="fsExit" type="button" aria-label="Exit full screen">Exit full screen ✕</button>
<script>
(function(){
  var tabs=[].slice.call(document.querySelectorAll('.tab')), titles={v5:'V5',v1:'V1',v3:'V3',v4:'V4',card:'Original card'};
  var curTab='v5', isFs=false;
  function broadcastFs(){
    document.querySelectorAll('.panel iframe').forEach(function(f){
      try{if(f.contentWindow) f.contentWindow.postMessage({type:'lk-fs-state',active:isFs},'*');}catch(e){}
    });
  }
  function applyFs(on,fromNative){
    isFs=!!on;
    document.body.classList.toggle('is-fs',isFs);
    document.body.classList.toggle('fs-v1',isFs && curTab==='v1');
    if(!fromNative){
      var el=document.documentElement;
      if(isFs){
        try{var p=(el.requestFullscreen||el.webkitRequestFullscreen); if(p) Promise.resolve(p.call(el)).catch(function(){});}catch(e){}
      }else{
        if(document.fullscreenElement||document.webkitFullscreenElement){
          try{var ex=(document.exitFullscreen||document.webkitExitFullscreen); if(ex) Promise.resolve(ex.call(document)).catch(function(){});}catch(e){}
        }
      }
    }
    broadcastFs();
  }
  function show(id,focus){
    if(!titles[id]) id='v5';
    curTab=id;
    document.body.classList.toggle('fs-v1',isFs && curTab==='v1');
    tabs.forEach(function(t){var on=t.dataset.tab===id;t.setAttribute('aria-selected',on);t.tabIndex=on?0:-1;if(on&&focus)t.focus();});
    document.querySelectorAll('.panel').forEach(function(p){var on=p.id==='panel-'+id;p.classList.toggle('on',on);
      var f=p.querySelector('iframe'); if(on&&!f.src) f.src=f.dataset.src;});
    document.title=titles[id]+' · Progressive Lenses Price Card';
  }
  tabs.forEach(function(t,i){
    t.addEventListener('click',function(){location.hash=t.dataset.tab;});
    t.addEventListener('keydown',function(e){var k=e.key,n=tabs.length,j=-1;
      if(k==='ArrowRight')j=(i+1)%n;else if(k==='ArrowLeft')j=(i-1+n)%n;else if(k==='Home')j=0;else if(k==='End')j=n-1;
      if(j>-1){e.preventDefault();location.hash=tabs[j].dataset.tab;tabs[j].focus();}});
  });
  document.getElementById('fsBtn').addEventListener('click',function(){applyFs(!isFs);});
  document.getElementById('fsExit').addEventListener('click',function(){applyFs(false);});
  document.addEventListener('fullscreenchange',function(){if(!document.fullscreenElement&&isFs)applyFs(false,true);});
  document.addEventListener('webkitfullscreenchange',function(){if(!document.webkitFullscreenElement&&isFs)applyFs(false,true);});
  addEventListener('keydown',function(e){if(e.key==='Escape'&&isFs)applyFs(false);});
  addEventListener('message',function(e){
    var d=e.data||{};
    if(d.type==='lk-fs-toggle') applyFs(!isFs);
    else if(d.type==='lk-fs-query') broadcastFs();
  });
  function route(){show((location.hash||'#v5').slice(1).split('/')[0]);}
  addEventListener('hashchange',route); route();
})();
</script>
</body>
</html>
