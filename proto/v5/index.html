<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V5 · Corridor GIFs and Lottie</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page">
  <header class="top">
    <div>
      <h1>Corridor GIFs and Lottie</h1>
      <p>All seven lenses on one page. Every file is 150 × 90 px, the same size as the strip on the Figma card, and loops forever. All animations start together.</p>
    </div>
    <div class="seg" role="radiogroup" aria-label="Preview as">
      <span class="seg-l">Preview</span>
      <button role="radio" aria-checked="true" data-mode="gif">GIF</button>
      <button role="radio" aria-checked="false" data-mode="lottie">Lottie</button>
    </div>
  </header>
  <section class="grid" id="grid" aria-label="Corridor animations"></section>
</main>
<script src="vendor/lottie_light.min.js"></script>
<script src="app.js"></script>
</body>
</html>
